name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Prepare application directory on the server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: "ubuntu"
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script_stop: true
          script: |
            set -eu
            deploy_dir="/home/ubuntu/app/aws-nest-cicd"
            mkdir -p "$deploy_dir"
            find "$deploy_dir" -mindepth 1 -maxdepth 1 ! -name '.env' -exec rm -rf -- {} +

      - name: Upload build and runtime manifests
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: "ubuntu"
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "dist,script,ecosystem.config.cjs,package.json,package-lock.json"
          target: "/home/ubuntu/app/aws-nest-cicd"

      - name: Install production dependencies, migrate, and start application
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: "ubuntu"
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script_stop: true
          script: |
            set -eu
            cd "/home/ubuntu/app/aws-nest-cicd"
            npm ci --omit=dev
            npm run migration:run:prod
            pm2 startOrReload ecosystem.config.cjs --update-env
            pm2 save
